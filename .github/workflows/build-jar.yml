# Builds one jar from the ref it is given and uploads it as an artifact.
#
# Callers:
#   - build.yml on every push and pull request (builds the pushed ref)
#   - auto-release.yml on main, one job per supported Minecraft branch
#
# This workflow never creates a release. Publishing happens on main only.

name: build jar

on:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or commit to build. Empty builds the caller's ref.
        required: false
        type: string
        default: ''
    outputs:
      artifact:
        description: Name of the uploaded artifact
        value: ${{ jobs.build.outputs.artifact }}
      version:
        description: Mod version read from version.txt of the built ref
        value: ${{ jobs.build.outputs.version }}
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build. Empty builds the selected ref.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Read the ref and the mod version
        id: meta
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          REF="${INPUT_REF}"
          if [[ -z "$REF" ]]; then
            REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi
          LABEL="${REF//\//-}"
          VERSION="$(tr -d '[:space:]' < version.txt)"

          echo "artifact=dedicatedpower-${LABEL}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ${REF} (${LABEL}), version ${VERSION}"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: microsoft

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build

      - name: Collect the release jar
        shell: bash
        run: |
          set -euo pipefail

          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            -print | head -1)
          if [[ -z "$JAR" ]]; then
            echo "No release jar found in build/libs." >&2
            ls -la build/libs || true
            exit 1
          fi
          mkdir -p dist
          cp "$JAR" dist/
          echo "Collected ${JAR}"

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: dist/*.jar
          if-no-files-found: error
